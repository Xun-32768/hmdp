server:
  port: 30002
  tomcat:
    threads:
      max: 500         # 最大工作线程数（默认200）
      min-spare: 50    # 最小空闲线程数
    accept-count: 2000 # 允许在队列中排队的最大连接数（关键！防止连接直接被拒）
    max-connections: 5000 # 最大允许建立的 TCP 连接数

# 192.168.29.255
mybatis-plus:
  mapper-locations: classpath:mapper/*xml
  type-aliases-package: com.hmdp.pojo.entity

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # serverTimezone 必须与业务时区（SystemConstants.BIZ_ZONE_ID）保持一致，
    # 否则 timestamp 列的字面量与 Java 侧的 LocalDateTime 比较时会产生时差
    url: jdbc:mysql://127.0.0.1:3307/hmdp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  # 定时任务调度线程池：默认仅 1 条线程，当有多个定时任务（库存对账、超时关单、死信巡检、MQ确认超时清理）时会互相阻塞
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: hmdp-task-
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  rabbitmq:
    host: 127.0.0.1
    port: 5673
    username: root
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated # 开启异步确认机制
    publisher-returns: true # 开启消息路由失败退回
    listener:
      simple:
        acknowledge-mode: manual # 开启手动 ACK，确保业务执行成功才删消息
        prefetch: 10 # 限制每个消费者每次预取的消息数量，防止内存被打满

  data:
    redis:
      password: 123456
      host: 127.0.0.1
      port: 6379
      # 连接超时时间
      timeout: 5000ms
      # 以下是连接池配置
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制）
          max-active: 8
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池中的最小空闲连接
          min-idle: 1
          # 连接池最大阻塞等待时间（负值表示无限等待）
          max-wait: -1ms
          # 核心配置：每 10 秒检查一次空闲连接
          time-between-eviction-runs: 10s

logging:
  level:
    '[com.hmdp]': debug

# MinIO 对象存储配置
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: P@ssword123
  bucket-name: hmdp-test
